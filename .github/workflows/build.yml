# Daily check that the patch still applies: build the newest stable 9.x release
# and smoke-test it. Nothing is published; people build the image themselves.
# Run it by hand (Actions -> build -> Run workflow) to test a specific version.
#
# GitHub's runners have seccomp, so this checks that the patched image builds and
# works, but not the no-seccomp path itself; build.sh on a Synology box checks that.
name: build
on:
  schedule:
    - cron: "30 6 * * *"
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Elasticsearch version (blank = newest 9.x)"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: ./build.sh ${{ inputs.version }}
